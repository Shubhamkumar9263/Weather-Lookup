<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Lookup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
      font-size: 2rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    #city-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    #city-input:focus {
      border-color: #667eea;
    }

    #get-weather {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    #get-weather:hover {
      background: #5568d3;
    }

    .weather-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      display: none;
    }

    .weather-card.active {
      display: block;
    }

    .weather-card h2 {
      margin-bottom: 15px;
      color: #333;
      font-size: 1.5rem;
    }

    .weather-card p {
      margin: 8px 0;
      color: #555;
      font-size: 1rem;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌤️ Weather Lookup</h1>
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name (e.g., Jabalpur)" />
      <button id="get-weather">Get Weather</button>
    </div>
    <div id="weather-result" class="weather-card"></div>
  </div>

  <script>
    document.getElementById('get-weather').addEventListener('click', async function () {
      const city = document.getElementById('city-input').value.trim();
      const resultDiv = document.getElementById('weather-result');

      if (!city) {
        resultDiv.innerHTML = '<p class="error">Please enter a city name.</p>';
        resultDiv.classList.add('active');
        return;
      }

      resultDiv.classList.remove('active');
      resultDiv.innerHTML = '<p>Loading...</p>';
      resultDiv.classList.add('active');

      try {
        
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('City not found. Please check the spelling.');
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();

        const current = weatherData.current;
        const temp = current.temperature_2m;
        const humidity = current.relative_humidity_2m;
        const windSpeed = current.wind_speed_10m;
        const weatherCode = current.weather_code;

        const weatherDesc = getWeatherDescription(weatherCode);

        resultDiv.innerHTML = `
          <h2>${name}, ${country}</h2>
          <p><strong>Temperature:</strong> ${temp} °C</p>
          <p><strong>Conditions:</strong> ${weatherDesc}</p>
          <p><strong>Humidity:</strong> ${humidity} %</p>
          <p><strong>Wind Speed:</strong> ${windSpeed} km/h</p>
        `;
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    });

    function getWeatherDescription(code) {
      const codes = {
        0: 'Clear sky',
        1: 'Mainly clear',
        2: 'Partly cloudy',
        3: 'Overcast',
        45: 'Fog',
        48: 'Depositing rime fog',
        51: 'Light drizzle',
        53: 'Moderate drizzle',
        55: 'Dense drizzle',
        61: 'Slight rain',
        63: 'Moderate rain',
        65: 'Heavy rain',
        71: 'Slight snow',
        73: 'Moderate snow',
        75: 'Heavy snow',
        80: 'Slight rain showers',
        81: 'Moderate rain showers',
        82: 'Violent rain showers',
        95: 'Thunderstorm',
        96: 'Thunderstorm with slight hail',
        99: 'Thunderstorm with heavy hail'
      };
      return codes[code] || 'Unknown';
    }
  </script>
</body>
</html>
